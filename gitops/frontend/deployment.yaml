apiVersion: apps/v1
kind: Deployment
metadata:
  name: 30sales-front
  labels:
    app.kubernetes.io/name: 30sales-front
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: 30sales-front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: 30sales-front
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/3035tech/30sales-front:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
