name: Build and publish images

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - '30sales-back/**'
      - '30sales-front/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    paths:
      - '30sales-back/**'
      - '30sales-front/**'
      - '.github/workflows/build-images.yml'

permissions:
  contents: read

jobs:
  build-pull-request:
    name: Build ${{ matrix.name }} (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./30sales-back
            image: ghcr.io/3035tech/30sales-back
          - name: frontend
            context: ./30sales-front
            image: ghcr.io/3035tech/30sales-front
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image without publishing
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false

  publish:
    name: Build and publish ${{ matrix.name }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./30sales-back
            image: ghcr.io/3035tech/30sales-back
          - name: frontend
            context: ./30sales-front
            image: ghcr.io/3035tech/30sales-front
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
