apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 30sales-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/3035tech/30sales.git
    targetRevision: main
    path: gitops/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: 30sales
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
