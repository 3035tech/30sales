apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 30sales-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/3035tech/30sales.git
    targetRevision: main
    path: gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
