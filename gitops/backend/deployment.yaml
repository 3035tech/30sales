apiVersion: apps/v1
kind: Deployment
metadata:
  name: 30sales-back
  labels:
    app.kubernetes.io/name: 30sales-back
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: 30sales-back
  template:
    metadata:
      labels:
        app.kubernetes.io/name: 30sales-back
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: ghcr.io/3035tech/30sales-back:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: 30sales-backend-runtime
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
