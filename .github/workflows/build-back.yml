name: Build and publish backend

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - '30sales-back/**'
      - '30sales-back/Dockerfile'
      - '.github/workflows/build-back.yml'
  pull_request:
    paths:
      - '30sales-back/**'
      - '30sales-back/Dockerfile'
      - '.github/workflows/build-back.yml'

permissions:
  contents: read

jobs:
  build-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build backend image without publishing
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./30sales-back
          platforms: linux/amd64
          push: false

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/3035tech/30sales-back
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./30sales-back
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Promote backend image in GitOps
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          sed -i "s/^  newTag: .*/  newTag: ${IMAGE_TAG}/" gitops/backend/kustomization.yaml
          git add gitops/backend/kustomization.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(gitops): promote backend image"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
